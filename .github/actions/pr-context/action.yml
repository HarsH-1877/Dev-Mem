name: "Dev-Mem PR Context & Verification"
description: "Comments relevant Dev-Mem constraints, decisions, and regression warnings on PRs, and marks matching nodes verified on green merge."
inputs:
  base-ref:
    description: "Base git ref for changed-file diff (e.g. origin/main)"
    required: false
    default: "origin/main"
  head-ref:
    description: "Head git ref for changed-file diff"
    required: false
    default: "HEAD"
  verify-on-merge:
    description: "Promote matching non-failure nodes to verified and update MEMORY.md/shared.jsonl"
    required: false
    default: "false"
  dev-memo-version:
    description: "Version of dev-memo npm package to run (or 'local' to run dist/cli/index.js)"
    required: false
    default: "latest"
  github-token:
    description: "GitHub token used to post or update PR comments"
    required: false
    default: "${{ github.token }}"
outputs:
  comment-path:
    description: "Path to generated Markdown comment file"
    value: ${{ steps.generate.outputs.comment_path }}
  has-context:
    description: "Whether relevant context or warnings were found ('true' or 'false')"
    value: ${{ steps.generate.outputs.has_context }}
  verified-count:
    description: "Number of knowledge nodes auto-verified"
    value: ${{ steps.generate.outputs.verified_count }}

runs:
  using: "composite"
  steps:
    - name: Generate Dev-Mem PR context
      id: generate
      shell: bash
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        set -euo pipefail
        COMMENT_FILE=".dev-mem/pr-comment.md"
        ARGS=(pr-context --base "${{ inputs.base-ref }}" --head "${{ inputs.head-ref }}" --out "$COMMENT_FILE" --json)
        if [ -n "${PR_TITLE:-}" ]; then
          ARGS+=(--title "$PR_TITLE")
        fi
        if [ "${{ inputs.verify-on-merge }}" = "true" ]; then
          ARGS+=(--verify-on-merge)
        fi

        if [ "${{ inputs.dev-memo-version }}" = "local" ] && [ -f "dist/cli/index.js" ]; then
          JSON_OUT=$(node dist/cli/index.js "${ARGS[@]}")
        else
          JSON_OUT=$(npx --yes "dev-memo@${{ inputs.dev-memo-version }}" "${ARGS[@]}")
        fi

        echo "$JSON_OUT"
        HAS_CTX=$(node -e 'const d = JSON.parse(process.argv[1]); process.stdout.write(String(Boolean(d.hasContent)));' "$JSON_OUT")
        VERIFIED=$(node -e 'const d = JSON.parse(process.argv[1]); process.stdout.write(String((d.verifiedNodeIds || []).length));' "$JSON_OUT")
        echo "comment_path=$COMMENT_FILE" >> "$GITHUB_OUTPUT"
        echo "has_context=$HAS_CTX" >> "$GITHUB_OUTPUT"
        echo "verified_count=$VERIFIED" >> "$GITHUB_OUTPUT"

    - name: Post or update PR comment
      if: github.event_name == 'pull_request' && steps.generate.outputs.has_context == 'true' && inputs.github-token != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- dev-mem-pr-context -->';
          const body = fs.readFileSync('${{ steps.generate.outputs.comment_path }}', 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
